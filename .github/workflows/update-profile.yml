name: Update Profile README

# 全部入口就这一个 workflow：
#   - 定时（schedule）：cron 每天唤醒，是否真跑由 interval_days 间隔门决定
#     （Run workflow 的「定时运行间隔」下拉可一键改 1/3/5/7 天，见 docs/guide.md）
#   - 手动 Run workflow：四个控件——本次强制重跑（单选下拉，四选一）/ 更新主页 /
#     等待合并 / 定时运行间隔（模式 B 的 git-data 推送与 PR 需配置 WORKFLOW_PAT secret）
#   - 保存即触发（push）：README.md / README.en.md 推到 main 即唤醒，秒级生效；
#     与定时/手动共用 concurrency 串行，防循环由 [skip ci] + paths 过滤 + branches:[main] 三重保险
on:
  push:
    branches: [main]
    paths: [README.md, README.en.md] # 只圈两个 README 文件——其余 push 不触发
  schedule:
    - cron: "23 2 * * *" # 每天 02:23 UTC ≈ 北京 10:23 唤醒；间隔门决定今天是否真跑
    # interval_days: 3 —— 定时运行间隔（天）；Run workflow 下拉改写，勿手改
    # interval_anchor: 2026-10-22 —— 间隔锚点（UTC 日期）；改间隔时自动重置
  workflow_dispatch:
    inputs:
      rerun:
        # 重叠勾选合并为一个单选下拉（2026-10-24）：四选一互斥，勾选之间不再有
        # 「勾了 A 又勾 B 会怎样」的重叠/抵消关系
        description: "选强制重跑的范围；不选 = 只更新有变化的内容（AI 简介/补位文案仍按缓存复用）"
        type: choice
        default: "不强制（按变化更新）"
        options:
          - "不强制（按变化更新）"
          - "强制重写主页"
          - "强制重跑各仓库 README（主页仍按变化更新）"
          - "两者都强制（主页重写 + 仓库 README 全量重跑）"
      update_readme:
        description: "更新个人主页 overview（默认勾选）；不勾 = 本轮完全不动主页（选了强制重写也跳过）"
        type: boolean
        default: true
      wait_for_merges:
        description: "开 PR 后等你合并（最多 30 分钟）；不勾 = 直接结束，PR 留着随时可合"
        type: boolean
        default: false
      schedule_interval:
        description: "改定时周期（本轮结束后生效）；选『不修改』则不改"
        type: choice
        default: 不修改（保持当前周期）
        options:
          - 不修改（保持当前周期）
          - 每 1 天
          - 每 3 天
          - 每 5 天
          - 每 7 天

# 防止定时与手动同时运行；不取消进行中的运行
concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: write
  # 有意变更（A-P0）：pull-requests 权限随方向二 PR 审核流一并移除（gh pr 命令已删）
  issues: write # 模式 B 清单 issue 用内置 GITHUB_TOKEN 开/改/关（§5.7）

jobs:
  update:
    # 模板仓库自身永不运行：它的 README 是给用户看的说明页，不是个人主页
    if: github.repository != 'ningbojian/ProfileReadmeAgent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不装任何依赖，纯 grep 判断定时开关 + 定时间隔门
      - name: 检查定时开关与运行间隔（schedule.enabled / interval_days）
        if: github.event_name == 'schedule'
        id: check
        run: |
          if grep -A3 '^schedule:' config.yaml | grep -qE 'enabled:[[:space:]]*false'; then
            echo "schedule=false" >> "$GITHUB_OUTPUT"
            echo "定时更新已关闭（config.yaml 中 schedule.enabled=false），本次跳过"
            exit 0
          fi
          echo "schedule=true" >> "$GITHUB_OUTPUT"
          # 间隔门：cron 每天唤醒，实际是否运行由 interval_days × interval_anchor 决定
          # （两个标记由 Run workflow 的「定时运行间隔」下拉自动改写；删掉两行标记 = 恢复纯 cron）
          DAYS=$(grep -oE '# interval_days: *[0-9]+' .github/workflows/update-profile.yml | grep -oE '[0-9]+' | head -1)
          ANCHOR=$(grep -oE '# interval_anchor: *[0-9]{4}-[0-9]{2}-[0-9]{2}' .github/workflows/update-profile.yml | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          if [ -n "$DAYS" ] && [ -n "$ANCHOR" ] && [ "$DAYS" -gt 0 ]; then
            DIFF=$(( ( $(date -u +%s) - $(date -u -d "$ANCHOR" +%s) ) / 86400 ))
            if [ $(( DIFF % DAYS )) -ne 0 ]; then
              echo "schedule=false" >> "$GITHUB_OUTPUT"
              echo "距锚点 ${ANCHOR} 已 ${DIFF} 天，非每 ${DAYS} 天的运行日，本次跳过（Run workflow 下拉可改间隔）"
            fi
          fi

      - uses: actions/setup-python@v6
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        run: pip install .

      - name: 读取配置路径
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        id: paths
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}
          rp = (c.get('readme') or {}).get('path', 'README.md')
          print(f"readme={rp}")
          # 双语第二文件与 cli 同口径派生：README.md → README.en.md（WP8）
          print(f"readme_en={rp[:-3] + '.en.md' if rp.endswith('.md') else rp + '.en.md'}")
          print(f"snapshot={(c.get('snapshot') or {}).get('path', 'data/snapshot.json')}")
          PY

      # 有意变更（A-P0）：方向二功能已移除——原「解析勾选/点名的仓库」步骤随
      # 点名仓库链路一并下线（inputs 无勾选框、恒输出空，唯一消费者是方向二点名重跑）

      - name: 生成 README
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }} # 模式 B：compare/git-data 推送/PR/轮询（§5.7）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # concurrency 组串行：多轮触发会显示 Queued——排队等待上一轮完成，已开的 PR 不受影响
          echo "提示：定时/手动多轮触发会排队串行执行（显示 Queued），排队期间已开的 PR 不受影响"
          FLAGS=""
          # 强制重跑范围：单选下拉四选一 → 一一对应 CLI 旗标（互斥，无重叠）
          case "${{ inputs.rerun }}" in
            "强制重写主页") FLAGS="$FLAGS --force" ;;
            "强制重跑各仓库 README（主页仍按变化更新）") FLAGS="$FLAGS --repo-readmes" ;;
            "两者都强制（主页重写 + 仓库 README 全量重跑）") FLAGS="$FLAGS --force --repo-readmes" ;;
          esac
          [ "${{ inputs.update_readme }}" = "false" ] && FLAGS="$FLAGS --skip-readme"
          # 等待仅勾选时执行（30 分钟窗口）；不勾与 cron 一样 0 分钟——直接继续
          [ "${{ inputs.wait_for_merges }}" = "true" ] && FLAGS="$FLAGS --wait-for-merges"
          python -m profile_agent --config config.yaml $FLAGS

      # 「定时运行间隔」下拉：选了天数就改写 cron 旁的间隔标记（提交由下一步统一完成）
      - name: 调整定时运行间隔（schedule_interval）
        if: github.event_name == 'workflow_dispatch'
        env:
          INTERVAL: ${{ inputs.schedule_interval }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          choice = os.environ.get("INTERVAL") or ""
          if choice.startswith("不修改"):
              print("未选择调整周期，保持当前定时不变")
              raise SystemExit(0)
          if not os.environ.get("WORKFLOW_PAT"):
              print("::warning::定时间隔调整需要 WORKFLOW_PAT（修改 workflow 文件）；本轮保持原周期")
              raise SystemExit(0)
          m = re.fullmatch(r"每 (\d+) 天", choice)
          if not m:
              raise SystemExit(f"未知的间隔选项：{choice!r}")
          n = int(m.group(1))
          p = pathlib.Path(".github/workflows/update-profile.yml")
          text = p.read_text(encoding="utf-8")
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          text = re.sub(r"# interval_days: *\d+", f"# interval_days: {n}", text, count=1)
          text = re.sub(
              r"# interval_anchor: *\d{4}-\d{2}-\d{2}",
              f"# interval_anchor: {today}",
              text,
              count=1,
          )
          p.write_text(text, encoding="utf-8")
          print(f"定时已改为每 {n} 天一次（锚点 {today} UTC 起算，每 N 天的对应日期运行）")
          PY

      # 有意变更（A-P0）：方向二已移除——PR 审核流与点名仓库链路一并下线，纯直提 main
      - name: 提交变更
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 文件可能不存在（如 readme.bilingual=false 或首次运行前关闭 readme），逐个判断再 add
          for p in "${{ steps.paths.outputs.readme }}" "${{ steps.paths.outputs.readme_en }}" "${{ steps.paths.outputs.snapshot }}"; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done

          # 定时间隔下拉会改写 workflow 文件；只有 staged 的文件才进提交。
          # 内置 GITHUB_TOKEN 无权推 workflow 变更——只在配了 WORKFLOW_PAT 时 stage。
          if ! git diff --quiet -- .github/workflows/update-profile.yml; then
            if [ -n "$WORKFLOW_PAT" ]; then
              git add .github/workflows/update-profile.yml
            else
              echo "::warning::定时间隔改动未保存：修改 workflow 文件需要 WORKFLOW_PAT（classic，勾选 repo 与 workflow）"
            fi
          fi

          has_direct=false
          if ! git diff --cached --quiet; then
            has_direct=true
          fi
          if [ "$has_direct" = "false" ]; then
            echo "无变更，跳过提交"
            exit 0
          fi

          # 有 WORKFLOW_PAT 时用它推送（内置 token 无权改 workflow 文件）。
          # 认证头经 git config 传递，不进 remote URL，避免 token 泄漏进日志。
          # 必须「覆盖」checkout 预设的同名认证头，不能用 -c 追加：
          # git 会把两层配置都当 Authorization header 发出去，GitHub 报
          # Duplicate header 400（实测踩过）。
          if [ -n "$WORKFLOW_PAT" ]; then
            AUTH=$(printf 'x-access-token:%s' "$WORKFLOW_PAT" | base64 | tr -d '\n')
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          fi
          git_push() {
            git push "$@"
          }
          git_pull_rebase() {
            git pull --rebase --autostash origin main
          }

          # ---- 直接提交 main：README/统计 ----
          git commit -m "chore: 自动更新 Profile README [skip ci]"
          pushed=false
          for i in 1 2 3; do
            if err=$(git_push 2>&1); then
              pushed=true
              break
            fi
            echo "$err"
            # 权限/认证类失败重试也没用，直接给出修法
            if echo "$err" | grep -qE 'workflows` permission|Authentication failed|invalid username or password|Support for password authentication'; then
              echo "::error::push 因权限/认证被拒：修改 workflow 文件需要配置 WORKFLOW_PAT secret（classic PAT 需勾选 repo 与 workflow 两项权限，见 docs/guide.md）；若已配置请检查是否过期"
              exit 1
            fi
            echo "push 被拒绝（main 有新提交），第 $i 次 rebase 重试..."
            git_pull_rebase
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::push 失败（可能与 main 上的手工修改冲突），请打开本次运行日志检查，或手动合并后重新运行工作流"
            exit 1
          fi
