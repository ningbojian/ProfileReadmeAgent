name: Update Profile README

# 这是「调用文件」：触发器、手动控件在这里，真正的逻辑在工具仓库的
# reusable-update-profile.yml（按 @v1 锁定版本，工具更新会自动生效）。
# 从模板创建仓库时这份文件会一起带过来；手动安装就把这份文件复制到
# .github/workflows/update-profile.yml，再补一个 config.yaml 即可。
on:
  push:
    branches: [main]
    paths: [README.md, README.en.md, config.yaml] # 不含 workflow 文件，避免自触发
  schedule:
    - cron: "23 2 * * *" # 每天 02:23 UTC ≈ 北京 10:23 唤醒；间隔门决定今天是否真跑
    # interval_days: 3 —— 定时运行间隔（天）；Run workflow 下拉改写，勿手改
    # interval_anchor: 2026-10-25 —— 间隔锚点（UTC 日期）；改间隔时自动重置
  workflow_dispatch:
    inputs:
      rerun:
        # 重叠勾选合并为一个单选下拉（2026-10-24）：四选一互斥，勾选之间不再有
        # 「勾了 A 又勾 B 会怎样」的重叠/抵消关系
        description: "选强制重跑的范围；不选 = 只更新有变化的内容（AI 简介/补位文案仍按缓存复用）"
        type: choice
        default: "不强制（按变化更新）"
        options:
          - "不强制（按变化更新）"
          - "强制重写主页"
          - "强制重跑各仓库 README（主页仍按变化更新）"
          - "两者都强制（主页重写 + 仓库 README 全量重跑）"
      update_readme:
        description: "更新个人主页 overview（默认勾选）；不勾 = 本轮完全不动主页（选了强制重写也跳过）"
        type: boolean
        default: true
      wait_for_merges:
        description: "开 PR 后等你合并（最多 30 分钟）；不勾 = 直接结束，PR 留着随时可合"
        type: boolean
        default: false
      schedule_interval:
        description: "改定时周期（本轮结束后生效）；选『不修改』则不改"
        type: choice
        default: 不修改（保持当前周期）
        options:
          - 不修改（保持当前周期）
          - 每 1 天
          - 每 3 天
          - 每 5 天
          - 每 7 天
  # 清单勾选联动（2026-10-27）：在清单 issue 里勾/取消「全部合并」或改动某一条时，
  # 同步总开关与各条目。只改正文排版，不跑更新（可复用 workflow 里走 sync-checklist）。
  issues:
    types: [edited]

# 防止定时与手动同时运行；不取消进行中的运行
concurrency:
  # 清单同步单独排队：否则会排在正在等待合并（最长 30 分钟）的更新任务后面，
  # 看起来像「勾了没反应」。同步组内取消旧运行（2026-10-27 提速）：连点时只让
  # 最后一轮回写，否则每点一次都要多排一整轮
  group: ${{ github.event_name == 'issues' && 'update-profile-sync' || 'update-profile' }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

permissions:
  contents: write
  # 有意变更（A-P0）：pull-requests 权限随方向二 PR 审核流一并移除（gh pr 命令已删）
  issues: write # 模式 B 清单 issue 用内置 GITHUB_TOKEN 开/改/关（§5.7）

jobs:
  update:
    # 模板仓库自身永不运行：它的 README 是给用户看的说明页，不是个人主页
    if: github.repository != 'ningbojian/ProfileReadmeAgent'
    uses: ningbojian/ProfileReadmeAgent/.github/workflows/reusable-update-profile.yml@v1
    with:
      # 调用方的触发事件：定时门/改周期/提交步骤靠它判断（called workflow 里不一定看得到）
      trigger_event: ${{ github.event_name }}
      rerun: ${{ inputs.rerun }}
      update_readme: ${{ inputs.update_readme }}
      wait_for_merges: ${{ inputs.wait_for_merges }}
      schedule_interval: ${{ inputs.schedule_interval }}
    # 跨账号调用不能用 secrets: inherit（仅限同组织/企业）；按名字传，未配置的就是空串
    secrets:
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
