# GitHub Overview Auto Agent 配置文件
# 使用指南见 docs/guide.md

schedule:
  enabled: true # false = 关闭定时更新（GitHub Actions 手动触发仍可用）

github:
  username: "" # 留空 = 自动使用仓库所有者（Use this template 拿到后无需改）
  token_env: "GITHUB_TOKEN" # token 所在环境变量名（Actions 内置 GITHUB_TOKEN 即可）

repos:
  exclude_forks: true
  exclude_archived: false
  exclude: [] # 仓库名黑名单，如 ["you/you"]（profile 仓库自身）

featured:
  count: 6
  min_stars: 0
  recency_days: 365 # 只考虑此时间内有 push 的仓库；0 = 不限
  sort_by: "score" # score | stars | updated
  score_stars_weight: 1.0
  score_recency_weight: 0.5

readme:
  enabled: true # false = 不更新个人主页 overview（可只更新项目介绍）
  path: "README.md"
  template: "templates/profile.md.j2"
  cards:
    theme: "github_dark"
    show: ["stats", "top_langs", "streak"] # 可选: stats, top_langs, streak
  include_update_time: true
  visitors_badge: false # true = 主页嵌入「主页访问量」计数徽章（komarev.com 免费第三方服务）

ai:
  enabled: true
  # provider: "anthropic" = Claude 官方 key（ANTHROPIC_API_KEY），默认
  # provider: "openai"    = 任意 OpenAI 兼容接口：DeepSeek / 通义千问 / Kimi / MiMo / Ollama 等
  #   openai 模式示例（三行照抄服务商文档）：
  #   provider: "openai"
  #   base_url: "https://api.deepseek.com"   ← 服务商地址（通常含 /v1）
  #   key_env: "AI_API_KEY"                 ← secret 名字（workflow 已内置注入，建议就叫这个）
  #   model: "deepseek-chat"                ← 服务商文档里的模型名
  provider: "anthropic"
  max_repos: 15 # 喂给模型的仓库数上限
  max_age_days: 14 # 简介最长复用天数，超过才重新生成
  bio_min_chars: 100
  bio_max_chars: 150
  language: "zh-CN"
  prompt_version: 1 # 改 prompt 时 +1，强制重新生成简介

projects:
  enabled: true # true = 生成项目介绍/简历素材（AI 内容走 PR 审核）
  dir: "docs/projects"
  featured_only: true # false = 给全部仓库生成
  include: [] # 非空 = 只给这些仓库名生成（多选），如 ["cool-tool", "web-app"]
  exclude: [] # 永远跳过这些仓库名
  review_via_pr: true # AI 生成内容走 PR 人工审核；false = 直接提交

snapshot:
  path: "data/snapshot.json"
